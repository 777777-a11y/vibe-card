<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>你的名字 · 个人名片</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232F5D62'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%23F6F7F9' stroke-width='3'/%3E%3C/svg%3E">
<style>
  /* ===== 基础与配色 ===== */
  :root {
    --bg: #F6F7F9;
    --card: #FFFFFF;
    --ink: #23272E;
    --ink-soft: #5B6470;
    --accent: #2F5D62;
    --accent-soft: #E4ECED;
    --line: #E7EAEE;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    line-height: 1.6;
  }

  /* 淡色装饰圆，不参与布局 */
  .deco {
    position: fixed;
    width: 320px;
    height: 320px;
    border-radius: 50%;
    background: var(--accent-soft);
    top: -140px;
    right: -110px;
    z-index: 0;
    pointer-events: none;
  }
  .deco::after {
    content: "";
    position: absolute;
    inset: 34px;
    border-radius: 50%;
    border: 1px solid rgba(47, 93, 98, 0.18);
  }

  /* ===== 名片主体（移动优先 375px） ===== */
  .wrap {
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    position: relative;
    z-index: 1;
  }

  .card {
    width: 100%;
    max-width: 520px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 40px 28px 32px;
    box-shadow: 0 10px 30px rgba(35, 39, 46, 0.06);
  }

  /* ===== 头部 ===== */
  .name {
    font-size: 32px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--ink);
    line-height: 1.3;
  }

  .tagline {
    margin-top: 10px;
    font-size: 15px;
    color: var(--ink-soft);
  }

  .divider {
    margin: 24px 0 20px;
    border: none;
    border-top: 1px solid var(--line);
  }

  /* ===== 联系方式 ===== */
  .contact {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .contact-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    background: #FAFBFC;
    border: 1px solid var(--line);
    border-radius: 12px;
  }

  .contact-item svg {
    flex: none;
    color: var(--accent);
  }

  .contact-body {
    min-width: 0;
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .label {
    font-size: 13px;
    color: var(--ink-soft);
  }

  .value {
    font-size: 15px;
    color: var(--ink);
    word-break: break-all;
    display: inline-block;
    margin-top: 1px;
  }

  a.value {
    text-decoration: none;
    color: var(--ink);
  }
  a.value:hover { color: var(--accent); }
  a.value:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 4px;
  }

  .copy-btn {
    flex: none;
    min-height: 44px;
    padding: 0 18px;
    border: 1px solid var(--accent);
    background: var(--card);
    color: var(--accent);
    font-size: 14px;
    font-family: inherit;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.18s ease, color 0.18s ease;
  }
  .copy-btn:hover { background: var(--accent); color: #fff; }
  .copy-btn:active { transform: scale(0.97); }
  .copy-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .copy-btn.copied { background: var(--accent); color: #fff; }

  /* ===== 页脚 ===== */
  .foot {
    margin-top: 24px;
    text-align: center;
    font-size: 12px;
    color: #9AA3AE;
  }

  /* ===== 复制提示 Toast ===== */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 36px;
    transform: translateX(-50%) translateY(8px);
    background: var(--ink);
    color: #fff;
    font-size: 14px;
    padding: 10px 20px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.22s ease, transform 0.22s ease;
    z-index: 10;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    .copy-btn, .toast { transition: none; }
    .copy-btn:active { transform: none; }
  }

  /* ===== 桌面扩展（≥768px） ===== */
  @media (min-width: 768px) {
    .card { padding: 56px 48px 40px; border-radius: 20px; }
    .name { font-size: 40px; }
    .tagline { font-size: 16px; margin-top: 12px; }
    .contact-item { padding: 16px 18px; }
    .value { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="deco" aria-hidden="true"></div>

<main class="wrap">
  <section class="card" aria-label="个人名片">
    <header>
      <h1 class="name">你的名字</h1>
      <p class="tagline">一句话简介 · 例如你的职业方向或正在做的事</p>
    </header>

    <hr class="divider">

    <ul class="contact">
      <li class="contact-item">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
        </svg>
        <div class="contact-body">
          <span class="label">微信</span>
          <span class="value" id="wechat-value">your_wechat_id</span>
        </div>
        <button type="button" class="copy-btn" id="copy-btn">复制</button>
      </li>

      <li class="contact-item">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="4" width="20" height="16" rx="2"/>
          <path d="m22 7-10 6L2 7"/>
        </svg>
        <div class="contact-body">
          <span class="label">邮箱</span>
          <a class="value" href="mailto:you@example.com" id="email-link">you@example.com</a>
        </div>
      </li>
    </ul>

    <p class="foot">© 2026 你的名字</p>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite">微信号已复制</div>

<script>
  (function () {
    var copyBtn = document.getElementById('copy-btn');
    var toast = document.getElementById('toast');
    var toastTimer = null;

    function showToast() {
      toast.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(function () {
        toast.classList.remove('show');
      }, 1800);
    }

    copyBtn.addEventListener('click', function () {
      var text = document.getElementById('wechat-value').textContent.trim();
      var done = function () {
        copyBtn.classList.add('copied');
        copyBtn.textContent = '已复制';
        showToast();
        setTimeout(function () {
          copyBtn.classList.remove('copied');
          copyBtn.textContent = '复制';
        }, 1800);
      };

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(done, function () {
          fallbackCopy(text, done);
        });
      } else {
        fallbackCopy(text, done);
      }
    });

    function fallbackCopy(text, done) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        done();
      } catch (e) {
        // 复制失败时不做额外处理
      }
      document.body.removeChild(ta);
    }
  })();
</script>
</body>
</html>
